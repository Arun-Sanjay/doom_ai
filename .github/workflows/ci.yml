# Runs on every push and pull request, on clean x86 Linux machines with the package versions of
# the official evaluation image (docker/requirements.lock), CPU only. The job runs twice, side by
# side, once for each part:
#
# part "agent": what decides whether the commit can be handed in
#   1. the rule-compliance lint of submission/            training/tests/test_rules.py
#   2. the agent fuzz, slow tests included, held to the   training/tests/test_fuzz.py
#      agent's 20 ms budget for this runner
#   3. submission readiness: the official validator run   validate.py --device cpu
#      exactly as the scorer runs the agent
#   4. the same validator with untrained networks         validate.py --device cpu
#      (only when step 3 failed)
#   5. the agent's time per decision on this runner       training/bench/agent_latency.py
# part "tests": the fast unit tests of every other area   training/tests (everything not marked slow)
#
# The unit tests are the long part (about three CPU-minutes on the development machine), so they
# get a machine of their own and the agent's results do not wait for them. Within a part every
# step runs whatever happened in the steps before it, so one failure never hides the lint, the
# fuzz, the validator or the latency number.
#
# Weights. The agent refuses to start when one of its weights files is not in the commit. Tests and
# benchmarks are about the code, so they run with DOOMNET_ALLOW_UNTRAINED=1 (set for the whole
# job), which lets a network without a file keep its initial weights. Step 3 removes the variable:
# it is the one step that says whether this commit could be handed in as it is, and it is red
# when the assembled agent cannot find its weights, which every other step tolerates on purpose.
# Local equivalents: replace `python` with `.venv/bin/python` and run from the repository root.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a failure in one part must not cancel the other
      matrix:
        part: [agent, tests]
    # An upper bound for a run in which something hangs: the step limits of the longer part add up
    # to 17 minutes and set-up needs a few more. A normal run should take a fraction of that.
    timeout-minutes: 22
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_PROGRESS_BAR: "off"
      PYTHONUNBUFFERED: "1"
      DOOMNET_ALLOW_UNTRAINED: "1"   # see "Weights" at the top; the readiness step removes it

    steps:
      # Downloads the Git LFS objects of this commit (the weights) on every run. Those downloads
      # count against the account's Git LFS bandwidth, so keep large files that the agent does not
      # load out of the tracked tree. The whole history is fetched because the lint also searches
      # every earlier commit for key-like tokens.
      - name: Check out the repository with its history and its Git LFS files
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python 3.13 with a pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docker/requirements.lock

      - name: Install the locked package versions (CPU build of torch)
        id: install
        run: |
          # Versions are read from docker/requirements.lock, the lock file of the official image.
          lock=docker/requirements.lock
          torch=$(grep -E "^torch==" "$lock")
          pins=()
          for name in vizdoom gymnasium numpy pillow pygame-ce; do
            pin=$(grep -E "^${name}==" "$lock")  # the step fails here if a package is missing from the lock
            pins+=("$pin")
          done
          echo "From $lock: $torch ${pins[*]}"
          python -m pip install "$torch" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "${pins[@]}" "pytest==9.2.0"
          python -m pip install ./env
          # the debug viewer's test writes an MP4 through ffmpeg
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          python -c "
          import doom_env, gymnasium, numpy, torch, vizdoom
          print('torch', torch.__version__, '| vizdoom', vizdoom.__version__, '| gymnasium', gymnasium.__version__, '| numpy', numpy.__version__)
          print('contract', doom_env.CONTRACT_VERSION, '| CUDA available:', torch.cuda.is_available())"

      - name: Check the committed weights
        shell: python
        run: |
          # Weights live in submission/weights and come through Git LFS. A pointer file means LFS did
          # not deliver them, and that fails here. Which files the agent needs is its own business:
          # the readiness step finds out by starting it the way the scorer does.
          import hashlib, os, pathlib, sys

          files = sorted(p for p in pathlib.Path("submission/weights").rglob("*") if p.is_file() and p.name != ".gitkeep")
          pointers = [p for p in files if p.read_bytes()[:64].startswith(b"version https://git-lfs")]
          for p in pointers:
              print(f"::error file={p}::{p} is a Git LFS pointer, not the weights file")
          if pointers:
              sys.exit(1)
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()[:12]}  {p.stat().st_size:>10} bytes  {p}" for p in files]
          if not files:
              lines = ["No weights are committed under submission/weights: the networks run UNTRAINED in the test and latency steps."]
              print("::warning::" + lines[0] + " A submission needs committed weights.")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Weights\n```\n" + "\n".join(lines) + "\n```\n")

      - name: Rule-compliance lint of submission/
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'agent' }}
        run: python -m pytest training/tests/test_rules.py -q

      # The whole file, the 1,200-decision run included: no other step plays more than the 525
      # decisions of the validator's map, and the longest maps have 1,050. The budget is the agent's
      # target for this runner (20 ms mean per decision), so the fuzz fails on mean > 20 ms or
      # p99 > 25 ms. Without the variable it would only enforce the scorer's 40 ms. The file makes
      # about 3,300 act() calls, and up to 2,600 more when a timing is over its bound and is repeated.
      - name: Agent fuzz (all of it, held to 20 ms per decision)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'agent' }}
        timeout-minutes: 6
        env:
          DOOMNET_FUZZ_BUDGET_MS: "20"
        run: python -m pytest training/tests/test_fuzz.py -q -rs

      # -x stops at the first failing test, which is why the lint and the fuzz have steps of their
      # own. The fuzz runs in full in the other part and is left out here; the lint takes a second
      # and stays in, so this part also shows it.
      - name: Unit tests (everything else not marked slow)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'tests' }}
        timeout-minutes: 12
        run: python -m pytest training/tests -q -x -m "not slow" -rs --durations=15 --deselect training/tests/test_fuzz.py

      # The scorer never sets DOOMNET_ALLOW_UNTRAINED. Without it the agent has to find its weights
      # in the commit, or its constructor raises and every map scores nothing. Forgetting to commit
      # a weights file is enough for that, and it is the one mistake the other steps cannot see.
      - name: Submission readiness (the official validator, run exactly as the scorer runs the agent)
        id: readiness
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'agent' }}
        timeout-minutes: 3
        run: |
          status=0
          env -u DOOMNET_ALLOW_UNTRAINED python validate.py --device cpu || status=1
          if ! grep -q doomnet submission/agent.py; then
            verdict="NOT A SUBMISSION YET: submission/agent.py is still the template placeholder (no weights are asked of it)"
            echo "::notice title=Not a submission yet::submission/agent.py is still the template placeholder."
          elif [ "$status" -ne 0 ]; then
            verdict="NOT READY: the validator fails when the agent is run as the scorer runs it. The usual cause is a weights file that is not in the commit (compare the Weights block with the log of this step)"
            echo "::error title=This commit cannot be scored::$verdict."
          elif [ -z "$(find submission/weights -type f ! -name .gitkeep)" ]; then
            verdict="NOT READY: submission/agent.py runs the doomnet networks, but no weights file is committed under submission/weights"
            echo "::error title=No weights in this commit::$verdict."
            status=1
          else
            verdict="READY: weights are committed and the validator passes without the untrained fallback"
          fi
          echo "$verdict"
          { echo "### Submission readiness"; echo "$verdict"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # When the commit is not ready, this tells a missing weights file from a broken pipeline: with
      # DOOMNET_ALLOW_UNTRAINED=1 (set for the job) the same episode must still play within the limits.
      - name: Official validator with untrained networks (only when the commit is not ready)
        if: ${{ !cancelled() && steps.readiness.outcome == 'failure' }}
        timeout-minutes: 3
        run: python validate.py --device cpu

      # The benchmark exits 1 when the mean is over the agent's target for this kind of machine.
      - name: Agent latency on this runner (mean, p95, max)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.part == 'agent' && hashFiles('training/bench/agent_latency.py') != '' }}
        timeout-minutes: 5
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python training/bench/agent_latency.py | tee "$RUNNER_TEMP/agent_latency.txt"
          { echo "### Agent latency on this runner"; echo '```'; cat "$RUNNER_TEMP/agent_latency.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
